<!DOCTYPE html>
<html lang='en' class='dark'>
    <head>
        <title>puzz.link puzzle index</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">

        <link rel="stylesheet" href="/css/db.css?<%= git.hash %>" />
        <link rel="stylesheet" href="/css/dark.css?<%= git.hash %>" />
    </head>
    <body>
        <script src="/theme.js?<%= git.hash %>"></script>
        <script src="/db.js?<%= git.hash %>"></script>
        <script>
          var app = Elm.Index.init({
            flags: {
              apiUrl: "https://puzz.link/db/api",
              userId: localStorage.getItem("user_id"),
              token: localStorage.getItem("token")
            }
          });
          app.ports.saveSession.subscribe(function(data) {
            if (!data.user_id || !data.token) {
              localStorage.removeItem("user_id");
              localStorage.removeItem("token");
            } else {
              localStorage.setItem("token", data.token);
              localStorage.setItem("user_id", data.user_id);
            }
          });
        </script>

        <script src="/db-extra.js?<%= git.hash %>"></script>
        <div id='extra'>
            <div>
                open all:
                <a class='open' data-target='lpzp' href='#'>[pzplus]</a>
                <a class='open' data-target='lpl' href='#'>[puzz.link]</a>
                <a class='open' data-target='lpzv' href='#'>[pzv.jp]</a>
            </div>
            <div>
                <label><input id='showdiff' type='checkbox'> show stats</label>
            </div>
            <div>
                <button id='skipgen'>skip generated</button>
            </div>
            <!-- <div> -->
            <!--     <input id='linksname'> -->
            <!--     <button id='linksbtn'>save this search</button> -->
            <!-- </div> -->
        </div>
    </body>
</html>
